[project]
name = "competitive-programming"
version = "0.1.0"
description = "Competitive programming problems and solutions in Python"
authors = [{ name = "Andrea Fiori" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.html]
directory = "htmlcov"
show_contexts = true
skip_covered = false
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
